<svg xmlns="http://www.w3.org/2000/svg" width="145" height="40" viewBox="0 0 145 40">
<defs>
<linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#FF5500"/>
<stop offset="100%" stop-color="#8c2e00"/>
</linearGradient>
<clipPath id="c2"><rect x="0" y="0" width="145" height="40" rx="20"/></clipPath>
<linearGradient id="s2" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
