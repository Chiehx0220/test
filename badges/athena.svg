<svg xmlns="http://www.w3.org/2000/svg" width="111" height="40" viewBox="0 0 111 40">
<defs>
<linearGradient id="g7" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#7C3AED"/>
<stop offset="100%" stop-color="#441f82"/>
</linearGradient>
<clipPath id="c7"><rect x="0" y="0" width="111" height="40" rx="20"/></clipPath>
<linearGradient id="s7" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
<stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
<stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<style>
@keyframes sweep7{from{transform:translateX(-111px)}to{transform:translateX(111px)}}
.shine7{animation:sweep7 3.2s ease-in-out infinite}
</style>
</defs>
<g clip-path="url(#c7)">
<rect x="0" y="0" width="111" height="40" fill="url(#g7)"/>
<circle cx="20" cy="20" r="14" fill="#ffffff" fill-opacity="0.15"/>
<image x="8" y="8" width="24" height="24" href="data:image/png;base64,"/>
<text x="42" y="25" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Athena</text>
<rect class="shine7" x="0" y="0" width="37" height="40" fill="url(#s7)" transform="skewX(-20)"/>
</g>
</svg>