<svg xmlns="http://www.w3.org/2000/svg" width="119" height="40" viewBox="0 0 119 40">
<defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#FF0000"/>
<stop offset="100%" stop-color="#8c0000"/>
</linearGradient>
<clipPath id="c1"><rect x="0" y="0" width="119" height="40" rx="20"/></clipPath>
<linearGradient id="s1" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
<stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
<stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<style>
@keyframes sweep1{from{transform:translateX(-119px)}to{transform:translateX(119px)}}
.shine1{animation:sweep1 3.2s ease-in-out infinite}
</style>
</defs>
<g clip-path="url(#c1)">
<rect x="0" y="0" width="119" height="40" fill="url(#g1)"/>
<circle cx="20" cy="20" r="14" fill="#ffffff" fill-opacity="0.15"/>
<image x="8" y="8" width="24" height="24" href="data:image/png;base64,"/>
<text x="42" y="25" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#ffffff">YouTube</text>
<rect class="shine1" x="0" y="0" width="39" height="40" fill="url(#s1)" transform="skewX(-20)"/>
</g>
</svg>