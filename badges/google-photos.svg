<svg xmlns="http://www.w3.org/2000/svg" width="170" height="40" viewBox="0 0 170 40">
<defs>
<linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#4285F4"/>
<stop offset="100%" stop-color="#244986"/>
</linearGradient>
<clipPath id="c3"><rect x="0" y="0" width="170" height="40" rx="20"/></clipPath>
<linearGradient id="s3" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
<stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
<stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<style>
@keyframes sweep3{from{transform:translateX(-170px)}to{transform:translateX(170px)}}
.shine3{animation:sweep3 3.2s ease-in-out infinite}
</style>
</defs>
<g clip-path="url(#c3)">
<rect x="0" y="0" width="170" height="40" fill="url(#g3)"/>
<circle cx="20" cy="20" r="14" fill="#ffffff" fill-opacity="0.15"/>
<image x="8" y="8" width="24" height="24" href="data:image/png;base64,"/>
<text x="42" y="25" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Google Photos</text>
<rect class="shine3" x="0" y="0" width="56" height="40" fill="url(#s3)" transform="skewX(-20)"/>
</g>
</svg>